name: Sync to HF Spaces

on:
  push:
    branches:
      - master
      - "claude/**"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to HF Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail

          DEPLOY_DIR="$RUNNER_TEMP/hf-space"
          mkdir -p "$DEPLOY_DIR"

          # HF Spaces rejects normal git pushes that contain binary files.
          # The app rebuilds prescriptions.db from markdown at startup,
          # so deploy a clean source tree without the local SQLite artifact.
          git archive --format=tar HEAD | tar -x -C "$DEPLOY_DIR"
          rm -f "$DEPLOY_DIR/prescriptions.db"

          cd "$DEPLOY_DIR"
          git init -b main
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add -A
          git commit -m "Sync from GitHub ${GITHUB_SHA}"
          git remote add hf https://user:$HF_TOKEN@huggingface.co/spaces/magicians7/korean-medicine-ai

          # Try both possible default branches for HF Spaces.
          git push hf main:main --force || git push hf main:master --force
